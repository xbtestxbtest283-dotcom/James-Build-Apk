<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>James Build APK</title><style>
body{font-family:Arial,sans-serif;background:#0b1020;color:#eef2ff;margin:0;display:grid;place-items:center;min-height:100vh}.card{width:min(680px,92vw);background:#151b31;padding:28px;border-radius:18px;box-shadow:0 12px 45px #0008}h1{margin-top:0}input,button{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #334155}input{background:#0f172a;color:white}button{background:#4f46e5;color:white;border:0;font-weight:700;cursor:pointer}.muted{color:#aab3cc;font-size:14px}#status{white-space:pre-wrap;background:#0f172a;padding:12px;border-radius:10px;min-height:22px}.hidden{display:none}a{color:#a5b4fc}
</style></head><body><main class="card"><h1>James Build APK</h1><p class="muted">Upload an Android Studio project ZIP and build it through your configured cloud backend.</p>
<label>Backend URL</label><input id="backend" placeholder="https://your-backend.onrender.com">
<label>Android Studio project (.zip)</label><input id="zip" type="file" accept=".zip,application/zip">
<button id="build">Build APK</button><div id="status">Ready. Set your backend URL, choose a ZIP, then press Build APK.</div><p class="muted">GitHub Pages hosts this screen only. The actual build requires the Node backend and GitHub Actions to be configured.</p></main>
<script>
const $=id=>document.getElementById(id), backend=$('backend'), zip=$('zip'), status=$('status');backend.value=localStorage.backend||'';
$('build').onclick=async()=>{let base=backend.value.trim().replace(/\/$/,'');if(!/^https:\/\//.test(base))return status.textContent='Enter your HTTPS backend URL first.';if(!zip.files[0])return status.textContent='Choose an Android Studio project ZIP first.';localStorage.backend=base;status.textContent='Uploading project...';try{let fd=new FormData();fd.append('projectZip',zip.files[0]);let r=await fetch(base+'/api/builds',{method:'POST',body:fd});let d=await r.json();if(!r.ok)throw new Error(d.error||'Upload failed');status.textContent='Build queued. Build ID: '+d.buildId;let t=setInterval(async()=>{try{let rr=await fetch(base+'/api/builds/'+d.buildId),x=await rr.json();status.textContent='Status: '+x.status+'\n'+(x.log||'');if(x.completed&&x.apkUrl){clearInterval(t);let a=document.createElement('a');a.href=x.apkUrl;a.textContent='Download APK';a.style.display='block';a.style.marginTop='12px';status.appendChild(document.createElement('br'));status.appendChild(a)}if(x.status==='failed')clearInterval(t)}catch(e){}},3000)}catch(e){status.textContent='Error: '+e.message}}
</script></body></html>
